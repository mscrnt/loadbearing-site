<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The CERTIFIED stamp, miniature — red on blueprint. -->
  <rect width="64" height="64" rx="6" fill="#0e2540"/>
  <g stroke="#d63837" fill="none">
    <circle cx="32" cy="32" r="24" stroke-width="2.5"/>
    <circle cx="32" cy="32" r="20" stroke-width="0.8"/>
  </g>
  <text x="32" y="36"
        text-anchor="middle"
        font-family="Iowan Old Style, Georgia, serif"
        font-size="11" font-weight="700"
        fill="#d63837" letter-spacing="0.5">CERT</text>
</svg>
